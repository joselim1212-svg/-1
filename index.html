<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가계부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💰</text></svg>">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--sub:#6b7686;--line:#e4e8ee;--ac:#2f6fed;--inc:#16a36a;--exp:#e5484d;--warn:#f5a524;--me:#2f6fed;--sp:#e0559b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--sub:#93a0b1;--line:#2a3340;--ac:#5b93ff;--inc:#3ecf8e;--exp:#ff6b70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--sub:#93a0b1;--line:#2a3340;--ac:#5b93ff;--inc:#3ecf8e;--exp:#ff6b70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:12px 14px}
.mn{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:17px;margin:4px 0 12px}
.mn button{background:none;border:0;color:var(--tx);font-size:22px;padding:2px 10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:26px;font-weight:800}
.inc{color:var(--inc)}.exp{color:var(--exp)}.sub{color:var(--sub);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.alert{background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.alert.over{background:color-mix(in srgb,var(--exp) 16%,var(--card));border-color:var(--exp)}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tx:first-child{border-top:0}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;margin-left:4px;vertical-align:middle}
.dh{font-size:13px;color:var(--sub);margin:12px 2px 4px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 0 8px;font-size:12px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav button span{display:block;font-size:19px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6;cursor:pointer}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.f{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--line)}.btn.d{background:var(--exp)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--sub);padding:8px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0}.lg i{width:12px;height:12px;border-radius:3px;flex:none}.lg span{flex:1}
.days{display:flex;align-items:flex-end;gap:2px;height:90px;overflow-x:auto}
.days div{flex:1;min-width:6px;background:var(--exp);border-radius:3px 3px 0 0;opacity:.85}
.msg{text-align:center;padding:50px 20px;color:var(--sub)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="msg">불러오는 중…</div></div>
<nav id="nav"></nav>
<button class="fab" id="fab" aria-label="추가">＋</button>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAvPyysXXeHKzNx1Q_uY3Kl7xASzxw-xFw",authDomain:"aabb-b8f5e.firebaseapp.com",projectId:"aabb-b8f5e",storageBucket:"aabb-b8f5e.firebasestorage.app",messagingSenderId:"9513965812",appId:"1:9513965812:web:8e83f139bb3f1e0b2ba6a1"};
const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),fs=getFirestore(fapp);
const mkdb=()=>({
 collection:n=>({doc:id=>({set:d=>setDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id))}),add:d=>addDoc(collection(fs,n),d),onSnapshot:(a,b)=>onSnapshot(collection(fs,n),a,b)}),
 doc:p=>{const[c,i]=p.split("/");return{set:d=>setDoc(doc(fs,c,i),d),onSnapshot:(a,b)=>onSnapshot(doc(fs,c,i),x=>a({exists:x.exists(),data:()=>x.data()}),b)}}
});
const EC=["식비","카페/간식","교통","주거/통신","생활용품","쇼핑","의료/건강","문화/여가","육아/교육","경조사","기타"];
const IC=["급여","부수입","용돈","기타수입"];
const PAYS=["카드","현금","계좌이체"];
const COL=["#2f6fed","#e5484d","#16a36a","#f5a524","#8b5cf6","#e0559b","#0ea5b7","#a16207","#64748b","#ea580c","#84cc16"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const pad=n=>String(n).padStart(2,"0");
const ymOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const dstr=d=>ymOf(d)+"-"+pad(d.getDate());
const S={tx:[],set:{budget:0,goal:{name:"",target:0,saved:0},fixed:[]},month:ymOf(new Date()),tab:"home",uid:null,names:{},q:"",who:"",cat:"",lt:false,ls:false,ran:false};
let db=null,user=null,F=null;
const defaults=()=>({budget:0,goal:{name:"",target:0,saved:0},fixed:[]});

try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function who(u){return u||"?"}
function wcol(u){return u===S.uid?"var(--me)":"var(--sp)"}
const inM=()=>S.tx.filter(t=>(t.date||"").startsWith(S.month));
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+(+t.amount||0),0);
function shiftM(d){const[y,m]=S.month.split("-").map(Number);const x=new Date(y,m-1+d,1);S.month=ymOf(x);render()}

function txRow(t){
  const ci=(t.type==="exp"?EC:IC).indexOf(t.cat);
  return `<div class="tx" data-edit="${esc(t.id)}"><div class="dot" style="background:${COL[(ci<0?8:ci)%COL.length]}">${esc((t.cat||"?").slice(0,1))}</div>
  <div class="m"><b>${esc(t.memo||t.cat)}</b><span class="sub">${esc(t.cat)} · ${esc(t.pay||"")}<span class="tag" style="background:${wcol(t.uid)}">${esc(who(t.uid))}</span></span></div>
  <div class="${t.type==="exp"?"exp":"inc"}"><b>${t.type==="exp"?"-":"+"}${won(t.amount)}</b></div></div>`}

function homeV(){
  const a=inM(),sp=sum(a,"exp"),inc=sum(a,"inc"),b=+S.set.budget||0,pc=b?sp/b*100:0,g=S.set.goal||{};
  let al="";
  if(b&&pc>=100)al=`<div class="alert over">🚨 이번 달 예산을 ${won(sp-b)} 초과했어요</div>`;
  else if(b&&pc>=80)al=`<div class="alert">⚠️ 예산의 ${Math.round(pc)}%를 썼어요 (남은 ${won(b-sp)})</div>`;
  const gp=g.target?Math.min(100,g.saved/g.target*100):0;
  const rec=[...a].sort((x,y)=>(y.date+(y.ts||0)).localeCompare(x.date+(x.ts||0))).slice(0,6);
  return al+`<div class="card"><h3>이번 달 지출</h3><div class="big exp">${won(sp)}</div>
  <div class="row sub" style="margin-top:6px"><span>수입 <b class="inc">${won(inc)}</b></span><span>잔액 <b>${won(inc-sp)}</b></span></div></div>
  <div class="card"><h3>월 예산</h3>${b?`<div class="row"><b>${won(sp)} / ${won(b)}</b><span class="sub">${Math.round(pc)}%</span></div>
  <div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>=100?"var(--exp)":pc>=80?"var(--warn)":"var(--ac)"}"></i></div><div class="sub">${b>=sp?"남은 예산 "+won(b-sp):"초과 "+won(sp-b)}</div>`:`<div class="sub">설정 탭에서 월 예산을 정해 보세요</div>`}</div>
  ${g.target?`<div class="card"><h3>🎯 ${esc(g.name||"저축 목표")}</h3><div class="row"><b>${won(g.saved)} / ${won(g.target)}</b><span class="sub">${Math.round(gp)}%</span></div><div class="bar"><i style="width:${gp}%;background:var(--inc)"></i></div></div>`:""}
  <div class="card"><h3>최근 내역</h3>${rec.length?rec.map(txRow).join(""):'<div class="sub">아직 내역이 없어요. ＋ 버튼으로 추가!</div>'}</div>`}

function listV(){
  return `<div class="card f"><input id="q" placeholder="🔍 메모·분류 검색" value="${esc(S.q)}">
  <div class="row" style="gap:8px"><select id="fw"><option value="">작성자 전체</option><option value="me">나</option><option value="ot">와이프</option></select>
  <select id="fc"><option value="">분류 전체</option>${[...EC,...IC].map(c=>`<option ${S.cat===c?"selected":""}>${c}</option>`).join("")}</select></div></div><div id="lst"></div>`}
function listItems(){
  const q=S.q.trim().toLowerCase();
  let a=inM().filter(t=>(!q||((t.memo||"")+t.cat+(t.pay||"")).toLowerCase().includes(q))&&(!S.cat||t.cat===S.cat)&&(!S.who||(S.who==="me"?t.uid===S.uid:t.uid!==S.uid)));
  a.sort((x,y)=>(y.date+(y.ts||0)).localeCompare(x.date+(x.ts||0)));
  if(!a.length)return '<div class="msg">내역이 없어요</div>';
  let h="",d="";
  for(const t of a){if(t.date!==d){d=t.date;const dd=new Date(d+"T00:00");h+=`<div class="dh">${dd.getMonth()+1}월 ${dd.getDate()}일 (${"일월화수목금토"[dd.getDay()]})</div>`}h+=`<div class="card" style="padding:0 14px;margin-bottom:6px">${txRow(t)}</div>`}
  return h}

function statsV(){
  const a=inM(),ex=a.filter(t=>t.type==="exp"),tot=sum(a,"exp");
  if(!ex.length)return '<div class="msg">이번 달 지출 내역이 없어요</div>';
  const by={};ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+(+t.amount||0));
  const cs=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  let off=0;const R=15.9155;
  const arcs=cs.map(([c,v])=>{const p=v/tot*100;const s=`<circle r="${R}" cx="21" cy="21" fill="none" stroke="${COL[EC.indexOf(c)%COL.length]}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p;return s}).join("");
  const dim=new Date(+S.month.slice(0,4),+S.month.slice(5),0).getDate(),dd=Array(dim).fill(0);
  ex.forEach(t=>dd[+t.date.slice(8)-1]+=+t.amount||0);const mx=Math.max(...dd,1);
  const pw={};ex.forEach(t=>pw[t.uid]=(pw[t.uid]||0)+(+t.amount||0));
  const py={};ex.forEach(t=>py[t.pay||"기타"]=(py[t.pay||"기타"]||0)+(+t.amount||0));
  const pm=(()=>{const[y,m]=S.month.split("-").map(Number);const k=ymOf(new Date(y,m-2,1));return S.tx.filter(t=>t.type==="exp"&&(t.date||"").startsWith(k)).reduce((s,t)=>s+(+t.amount||0),0)})();
  const df=tot-pm;
  return `<div class="card"><h3>카테고리별 지출</h3><div style="display:flex;justify-content:center"><svg viewBox="0 0 42 42" width="190" height="190">${arcs}<text x="21" y="22" text-anchor="middle" font-size="3.6" fill="currentColor" font-weight="700">${won(tot)}</text></svg></div>
  ${cs.map(([c,v])=>`<div class="lg"><i style="background:${COL[EC.indexOf(c)%COL.length]}"></i><span>${esc(c)}</span><b>${won(v)}</b><span class="sub" style="flex:none;width:40px;text-align:right">${Math.round(v/tot*100)}%</span></div>`).join("")}</div>
  <div class="card"><h3>누가 썼나</h3>${Object.entries(pw).map(([u,v])=>`<div class="lg"><i style="background:${wcol(u)}"></i><span>${esc(who(u))}</span><b>${won(v)}</b></div>`).join("")}</div>
  <div class="card"><h3>결제수단별</h3>${Object.entries(py).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<div class="lg"><span>${esc(c)}</span><b>${won(v)}</b></div>`).join("")}</div>
  <div class="card"><h3>일별 지출</h3><div class="days">${dd.map((v,i)=>`<div title="${i+1}일 ${won(v)}" style="height:${Math.max(2,v/mx*100)}%"></div>`).join("")}</div>
  <div class="sub" style="margin-top:8px">지난달 대비 ${pm?(df>=0?"+":"")+won(df):"비교 데이터 없음"}</div></div>`}

function setV(){
  const s=S.set,g=s.goal||{};
  return `<div class="card f"><h3>월 예산</h3><input id="sb" type="number" inputmode="numeric" placeholder="월 예산 (원)" value="${s.budget||""}"></div>
  <div class="card f"><h3>🎯 저축 목표</h3><input id="gn" placeholder="목표 이름 (예: 여행 자금)" value="${esc(g.name)}">
  <input id="gt" type="number" inputmode="numeric" placeholder="목표 금액" value="${g.target||""}"><input id="gs" type="number" inputmode="numeric" placeholder="현재까지 모은 금액" value="${g.saved||""}"></div>
  <div class="card f"><h3>🔁 고정지출 (매월 자동 입력)</h3>
  ${(s.fixed||[]).map(f=>`<div class="row"><span>${esc(f.name)} · 매월 ${f.day}일<br><span class="sub">${esc(f.cat)} · ${esc(f.pay)} · ${won(f.amount)}</span></span><button class="chip" data-delfx="${esc(f.id)}">삭제</button></div>`).join("")||'<div class="sub">등록된 고정지출이 없어요</div>'}
  <input id="fxn" placeholder="이름 (예: 월세)"><input id="fxa" type="number" inputmode="numeric" placeholder="금액"><input id="fxd" type="number" inputmode="numeric" placeholder="매월 며칠 (1~31)">
  <select id="fxc">${EC.map(c=>`<option>${c}</option>`).join("")}</select><select id="fxp">${PAYS.map(c=>`<option>${c}</option>`).join("")}</select>
  <button class="btn" id="fxadd">고정지출 추가</button></div>
  <div class="card f"><h3>기타</h3><button class="btn g" id="exp">📥 엑셀로 내보내기</button><button class="btn g" id="th">🌓 다크/라이트 전환</button><button class="btn g" id="lo">🚪 로그아웃 / 작성자 변경</button>
  <div class="sub">와이프 폰에서도 같은 주소를 열고 같은 이메일/비밀번호로 로그인하면 실시간으로 함께 써요.</div></div>`}

function render(){
  const nav=[["home","🏠","홈"],["list","📒","내역"],["stats","📊","통계"],["set","⚙️","설정"]];
  $("#nav").innerHTML=nav.map(n=>`<button class="${S.tab===n[0]?"on":""}" data-tab="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("");
  const[y,m]=S.month.split("-");
  const mn=S.tab==="set"?"":`<div class="mn"><button data-mm="-1">‹</button>${y}년 ${+m}월<button data-mm="1">›</button></div>`;
  $("#app").innerHTML=mn+({home:homeV,list:listV,stats:statsV,set:setV}[S.tab])();
  if(S.tab==="list"){$("#lst").innerHTML=listItems();$("#fw").value=S.who}
}
function save(){if(!db)return;db.doc("settings/main").set(S.set).catch(()=>toast("저장 실패, 다시 시도해 주세요"))}

function openForm(t){
  F=t?{...t}:{type:"exp",cat:"식비",pay:"카드",date:dstr(new Date()),amount:"",memo:""};
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="sh"><div class="seg"><button data-ty="exp">지출</button><button data-ty="inc">수입</button></div><div class="f">
  <input id="fa" type="number" inputmode="numeric" placeholder="금액" value="${F.amount||""}" style="font-size:22px;font-weight:700">
  <div class="chips" id="fcat"></div><div class="chips" id="fpay"></div>
  <input id="fd" type="date" value="${F.date}"><input id="fm" placeholder="메모 (선택)" value="${esc(F.memo)}">
  <button class="btn" id="fs">저장</button>${t?'<button class="btn d" id="fdel">삭제</button>':""}<button class="btn g" id="fx">닫기</button></div></div>`;
  document.body.appendChild(o);paintForm();
}
function paintForm(){
  document.querySelectorAll("[data-ty]").forEach(b=>b.classList.toggle("on",b.dataset.ty===F.type));
  const cs=F.type==="exp"?EC:IC;if(!cs.includes(F.cat))F.cat=cs[0];
  $("#fcat").innerHTML=cs.map(c=>`<button class="chip ${F.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("#fpay").innerHTML=PAYS.map(c=>`<button class="chip ${F.pay===c?"on":""}" data-p="${c}">${c}</button>`).join("")}
async function saveTx(){
  const amt=+$("#fa").value;if(!(amt>0)){toast("금액을 입력해 주세요");return}
  const d={type:F.type,amount:amt,cat:F.cat,pay:F.pay,date:$("#fd").value||dstr(new Date()),memo:$("#fm").value.trim(),uid:F.uid||S.uid,ts:F.ts||Date.now()};
  try{
    if(F.id)await db.collection("tx").doc(F.id).set(d);else await db.collection("tx").add(d);
    $("#ov").remove();
    if(d.type==="exp"&&S.set.budget){const k=d.date.slice(0,7);const sp=S.tx.filter(t=>t.type==="exp"&&t.date.startsWith(k)&&t.id!==F.id).reduce((s,t)=>s+(+t.amount||0),0)+amt;
      if(sp>S.set.budget)toast("🚨 월 예산을 초과했어요");else if(sp>=S.set.budget*.8)toast("⚠️ 예산의 "+Math.round(sp/S.set.budget*100)+"%를 썼어요")}
  }catch(e){toast("저장 실패, 다시 시도해 주세요")}}

function runFixed(){
  if(S.ran||!S.lt||!S.ls||!db)return;S.ran=true;
  const now=new Date(),ym=ymOf(now),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),ids=new Set(S.tx.map(t=>t.id));
  (S.set.fixed||[]).forEach(f=>{const day=Math.min(+f.day||1,dim);if(now.getDate()<day)return;const id="fx_"+f.id+"_"+ym;if(ids.has(id))return;
    db.collection("tx").doc(id).set({type:"exp",amount:+f.amount,cat:f.cat,pay:f.pay,date:ym+"-"+pad(day),memo:f.name+" (고정)",uid:S.uid,ts:Date.now()}).catch(()=>{})})}

function exportCsv(){
  const rows=[["날짜","구분","분류","결제수단","금액","메모","작성자"]];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type==="exp"?"지출":"수입",t.cat,t.pay||"",t.amount,t.memo||"",who(t.uid)]));
  const csv="\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="가계부.csv";document.body.appendChild(a);a.click();a.remove()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-edit]");if(!t)return;const D=t.dataset;
  if(D.tab){S.tab=D.tab;render()}else if(D.mm)shiftM(+D.mm);
  else if(D.edit){const x=S.tx.find(v=>v.id===D.edit);if(x)openForm(x)}
  else if(t.id==="fab"){if(db)openForm();else toast("로그인이 필요해요")}
  else if(D.ty){F.type=D.ty;paintForm()}else if(D.c){F.cat=D.c;paintForm()}else if(D.p){F.pay=D.p;paintForm()}
  else if(t.id==="fs")saveTx();else if(t.id==="fx")$("#ov").remove();
  else if(t.id==="fdel"){if(confirm("이 내역을 삭제할까요?"))db.collection("tx").doc(F.id).delete().then(()=>$("#ov").remove()).catch(()=>toast("삭제 실패"))}
  else if(t.id==="fxadd"){const n=$("#fxn").value.trim(),a=+$("#fxa").value,d=+$("#fxd").value;if(!n||!(a>0)||!(d>=1&&d<=31)){toast("이름·금액·날짜를 확인해 주세요");return}
    S.set.fixed=[...(S.set.fixed||[]),{id:Date.now().toString(36),name:n,amount:a,day:d,cat:$("#fxc").value,pay:$("#fxp").value}];S.ran=false;save();runFixed();toast("고정지출을 추가했어요")}
  else if(D.delfx){S.set.fixed=S.set.fixed.filter(f=>f.id!==D.delfx);save()}
  else if(t.id==="exp")exportCsv();
  else if(t.id==="lg"){signInWithEmailAndPassword(auth,$("#le").value.trim(),$("#lp").value).catch(()=>toast("로그인 실패: 이메일/비밀번호를 확인해 주세요"))}
  else if(D.nm){try{localStorage.setItem("who",D.nm)}catch(x){}start()}
  else if(t.id==="lo"){try{localStorage.removeItem("who")}catch(x){}signOut(auth).then(()=>location.reload())}
  else if(t.id==="th"){const c=getComputedStyle(document.documentElement).colorScheme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",c);try{localStorage.setItem("theme",c)}catch(x){}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#lst").innerHTML=listItems()}});
document.addEventListener("change",e=>{const i=e.target.id;
  if(i==="fw"){S.who=e.target.value;$("#lst").innerHTML=listItems()}else if(i==="fc"){S.cat=e.target.value;$("#lst").innerHTML=listItems()}
  else if(i==="sb"){S.set.budget=+e.target.value||0;save()}
  else if(i==="gn"||i==="gt"||i==="gs"){S.set.goal={name:$("#gn").value.trim(),target:+$("#gt").value||0,saved:+$("#gs").value||0};save()}});

let started=false;
function showLogin(){started=false;$("#nav").style.display="none";$("#fab").style.display="none";
  $("#app").innerHTML='<div class="card f" style="margin-top:60px"><h3>🔒 우리 가계부</h3><input id="le" type="email" placeholder="이메일" autocomplete="username"><input id="lp" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn" id="lg">로그인</button></div>'}
function start(){
  if(started)return;
  let n=null;try{n=localStorage.getItem("who")}catch(e){}
  $("#nav").style.display="";$("#fab").style.display="";
  if(!n){$("#nav").style.display="none";$("#fab").style.display="none";
    $("#app").innerHTML='<div class="card f" style="margin-top:60px"><h3>이 폰은 누구 거예요?</h3><button class="btn" data-nm="남편">남편</button><button class="btn" data-nm="와이프">와이프</button></div>';return}
  started=true;S.uid=n;db=mkdb();
  db.collection("tx").onSnapshot(s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()}));S.lt=true;render();runFixed()},()=>{$("#app").innerHTML='<div class="msg">데이터를 불러오지 못했어요. 새로고침하거나 다시 로그인해 주세요.</div>'});
  db.doc("settings/main").onSnapshot(s=>{S.set=s.exists?{...defaults(),...s.data()}:defaults();S.ls=true;
    if(!(document.activeElement&&/^(INPUT|SELECT)$/.test(document.activeElement.tagName)&&S.tab==="set"))render();runFixed()});
  render();
}
onAuthStateChanged(auth,u=>{if(u)start();else showLogin()});
</script>
</body>
</html>
